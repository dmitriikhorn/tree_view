<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tree View</title>
    <link rel="stylesheet" href="tree.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

<div id="legend">
    <h3>YANG nodes</h3>
    <div class="legend-content">
        <div class="legend-item"><span class="legend-color ChoiceNode"></span>ChoiceNode</div>
        <div class="legend-item"><span class="legend-color ContainerNode"></span>ContainerNode</div>
        <div class="legend-item"><span class="legend-color LeafNode"></span>LeafNode</div>
        <div class="legend-item"><span class="legend-color LeafListNode"></span>LeafListNode</div>
        <div class="legend-item"><span class="legend-color ListNode"></span>ListNode</div>
        <div class="legend-item"><span class="legend-color CaseNode"></span>CaseNode</div>
    </div>
</div>

<svg width="500vw" height="500vh"></svg>
<script type="module" src="tree.js"></script>
</body>
</html>
